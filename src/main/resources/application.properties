spring.application.name=demo
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
app.seed-demo=true
app.admin-password=${ADMIN_PASSWORD:Admin@12345}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/covietlau?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false
server.error.include-message=always
app.upload-dir=uploads
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB
