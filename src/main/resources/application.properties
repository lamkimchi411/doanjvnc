spring.application.name=demo
spring.jpa.defer-datasource-initialization=true
spring.sql.init.mode=always
app.seed-demo=true
app.admin-password=${ADMIN_PASSWORD:Admin@12345}
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/covietlau?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Ho_Chi_Minh}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:123456}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.thymeleaf.cache=false
server.address=0.0.0.0
server.port=${PORT:10000}
server.error.include-message=always
app.upload-dir=${APP_UPLOAD_DIR:uploads}
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=200MB
# Form cài đặt gửi cả ô chữ, ảnh trống và sáu ảnh check-in trong cùng yêu cầu.
server.tomcat.max-part-count=100
# Tên ảnh tiếng Việt dài có thể vượt giới hạn header mặc định 512 byte.
server.tomcat.max-part-header-size=4KB
# Cấu hình bằng biến môi trường khi triển khai; không lưu khóa PayOS vào mã nguồn.
app.payos.client-id=${PAYOS_CLIENT_ID:}
app.payos.api-key=${PAYOS_API_KEY:}
app.payos.checksum-key=${PAYOS_CHECKSUM_KEY:}
app.payos.public-url=${PAYOS_PUBLIC_URL:}
