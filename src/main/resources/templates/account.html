<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head}"></head><body class="bg-[#f6f1e8] text-stone-800"><header th:replace="~{fragments :: header}"></header><main class="mx-auto max-w-7xl p-5 md:p-10"><h1>Đơn thuê & ví cọc của tôi</h1><a class="btn" href="/appointments">Đặt lịch thử đồ</a><section class="panel overflow-auto"><table class="w-full"><tr><th>Đơn</th><th>Ngày thuê</th><th>Trạng thái</th><th>Cọc thực thu</th><th>Đã hoàn</th></tr><tr th:each="o:${orders}"><td><a th:href="@{/orders/{id}(id=${o.id})}" th:text="${'#CVL-'+o.id}"></a></td><td th:text="${o.pickupDate+' → '+o.returnDate}"></td><td th:text="${o.status}"></td><td th:text="${o.securityPaid+'đ'}"></td><td th:text="${o.refundedDeposit+'đ'}"></td></tr></table><p th:if="${#lists.isEmpty(orders)}">Bạn chưa có đơn thuê.</p></section><h2>Lịch thử đồ của tôi</h2><article class="panel" th:each="ap:${appointments}"><span th:text="${ap.appointmentAt+' · '+ap.status}"></span><form th:if="${ap.status=='Đã đặt lịch'}" th:action="@{/appointments/{id}/cancel(id=${ap.id})}" method="post"><button class="secondary">Hủy lịch</button></form></article></main></body></html>
