<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head}"></head>
<body class="bg-[#f6f1e8] text-stone-800">
<header th:replace="~{fragments :: header}"></header>
<main class="mx-auto max-w-7xl p-5 md:p-10">
 <h1>Đơn hàng của tôi</h1>
 <section class="panel overflow-auto">
  <h2>Đơn thuê</h2>
  <table class="w-full"><tr><th>Đơn</th><th>Ngày thuê</th><th>Trạng thái</th><th>Cọc thực thu</th><th>Đã hoàn</th><th>Thao tác</th></tr><tr th:each="o:${orders}"><td><a th:href="@{/orders/{id}(id=${o.id})}" th:text="${'#CVL-'+o.id}"></a></td><td th:text="${o.pickupDate+' → '+o.returnDate}"></td><td><span th:text="${o.holdExpired ? 'Hết hạn giữ chỗ' : o.status}"></span><small th:if="${o.holdExpired}" class="block font-medium text-red-700" th:text="${'Chưa nhận cọc, hết hạn lúc '+#temporals.format(o.holdUntil, 'dd/MM HH:mm')}"></small></td><td th:text="${o.securityPaid+'đ'}"></td><td th:text="${o.refundedDeposit+'đ'}"></td><td><a class="secondary whitespace-nowrap" th:href="@{/orders/{id}(id=${o.id})}" th:text="${o.editable ? 'Sửa / xóa' : 'Xem chi tiết'}"></a></td></tr></table>
  <p th:if="${#lists.isEmpty(orders)}">Bạn chưa có đơn thuê.</p>
 </section>
 <section class="panel overflow-auto">
  <h2>Đơn mua</h2>
  <table class="w-full"><tr><th>Mã đơn</th><th>Thời điểm</th><th>Sản phẩm</th><th>Thanh toán</th><th>Tổng tiền</th><th>Thao tác</th></tr><tr th:each="sale:${saleInvoices}" th:if="${sale.customerDeleted != true}"><td th:text="${'CVL-M'+sale.id}"></td><td th:text="${sale.issuedAt == null ? '—' : #temporals.format(sale.issuedAt, 'dd/MM/yyyy HH:mm')}"></td><td th:text="${sale.productName}"></td><td><span th:text="${sale.displayStatus}"></span><small class="block" th:text="${sale.paymentMethod == 'BANK' ? 'Chuyển khoản' : 'Tiền mặt'}"></small></td><td th:text="${#numbers.formatInteger(sale.salePrice,1,'POINT')+'đ'}"></td><td><a class="secondary whitespace-nowrap" th:href="@{/account/purchases/{id}(id=${sale.id})}" th:text="${sale.editable ? 'Sửa / xóa' : 'Xem chi tiết'}"></a></td></tr></table>
  <p th:if="${#lists.isEmpty(saleInvoices)}">Bạn chưa có đơn mua.</p>
 </section>
</main>
</body>
</html>
