<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head}"></head><body class="bg-[#f6f1e8] text-stone-800"><header th:replace="~{fragments :: header}"></header><main class="mx-auto max-w-7xl p-5 md:p-10">

<div class="flex flex-wrap items-start justify-between gap-3 mb-5">
  <div>
    <nav class="text-sm text-stone-400 mb-1"><a href="/admin">Quản trị</a> › Danh sách sản phẩm</nav>
    <h1>📦 Danh sách sản phẩm</h1>
    <p class="text-sm text-stone-500">Bấm vào ảnh hoặc tên sản phẩm để xem chi tiết, chỉnh sửa hoặc xóa.</p>
  </div>
  <a href="/admin/product/new" class="btn">+ Thêm sản phẩm</a>
</div>

<section class="panel overflow-x-auto">
  <div class="flex items-baseline justify-between gap-3 mb-3">
    <h2>Trang phục</h2>
    <span class="text-sm text-stone-400" th:text="${#lists.size(outfitProducts)+' sản phẩm'}"></span>
  </div>
  <table class="w-full min-w-[620px]">
    <thead><tr><th class="w-16">STT</th><th class="w-28">Ảnh</th><th>Tên sản phẩm</th><th>Danh mục</th></tr></thead>
    <tbody>
      <tr th:if="${#lists.isEmpty(outfitProducts)}"><td colspan="4" class="py-6 text-center text-stone-400">Chưa có trang phục.</td></tr>
      <tr th:each="p, stat : ${outfitProducts}" class="hover:bg-amber-50">
        <td th:text="${stat.count}"></td>
        <td>
          <a th:href="@{/admin/product/{id}(id=${p.id})}" class="block w-fit">
            <img th:if="${!#strings.isEmpty(p.imageUrl)}" th:src="${p.imageUrl}" th:alt="${p.name}" class="h-16 w-16 rounded object-cover border border-stone-200">
            <span th:unless="${!#strings.isEmpty(p.imageUrl)}" class="flex h-16 w-16 items-center justify-center rounded border border-stone-200 bg-stone-100 text-xs text-stone-400">Chưa có ảnh</span>
          </a>
        </td>
        <td><a th:href="@{/admin/product/{id}(id=${p.id})}" class="font-medium text-[#821f1c] hover:underline" th:text="${p.name}"></a></td>
        <td th:text="${p.category}"></td>
      </tr>
    </tbody>
  </table>
</section>

<section class="panel overflow-x-auto mt-5">
  <div class="flex items-baseline justify-between gap-3 mb-3">
    <h2>Phụ kiện</h2>
    <span class="text-sm text-stone-400" th:text="${#lists.size(accessoryProducts)+' phụ kiện'}"></span>
  </div>
  <table class="w-full min-w-[620px]">
    <thead><tr><th class="w-16">STT</th><th class="w-28">Ảnh</th><th>Tên phụ kiện</th><th>Danh mục</th></tr></thead>
    <tbody>
      <tr th:if="${#lists.isEmpty(accessoryProducts)}"><td colspan="4" class="py-6 text-center text-stone-400">Chưa có phụ kiện.</td></tr>
      <tr th:each="p, stat : ${accessoryProducts}" class="hover:bg-amber-50">
        <td th:text="${stat.count}"></td>
        <td>
          <a th:href="@{/admin/product/{id}(id=${p.id})}" class="block w-fit">
            <img th:if="${!#strings.isEmpty(p.imageUrl)}" th:src="${p.imageUrl}" th:alt="${p.name}" class="h-16 w-16 rounded object-cover border border-stone-200">
            <span th:unless="${!#strings.isEmpty(p.imageUrl)}" class="flex h-16 w-16 items-center justify-center rounded border border-stone-200 bg-stone-100 text-xs text-stone-400">Chưa có ảnh</span>
          </a>
        </td>
        <td><a th:href="@{/admin/product/{id}(id=${p.id})}" class="font-medium text-[#821f1c] hover:underline" th:text="${p.name}"></a></td>
        <td th:text="${p.category}"></td>
      </tr>
    </tbody>
  </table>
</section>

</main></body></html>
