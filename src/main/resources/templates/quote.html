<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head}"></head><body class="bg-[#f6f1e8] text-stone-800"><header th:replace="~{fragments :: header}"></header><main class="mx-auto max-w-7xl p-5 md:p-10"><section class="panel max-w-xl mx-auto"><h1>Dự toán đơn thuê</h1><dl class="space-y-3"><div>Tiền thuê (đã gồm giá cuối tuần/lễ): <b th:text="${quote.rent}"></b>đ</div><div>Giảm voucher/combo: <b th:text="${quote.discount}"></b>đ</div><div>Ship hai chiều: <b th:text="${quote.shipping}"></b>đ</div><div>Cọc bảo đảm: <b th:text="${quote.security}"></b>đ</div><div>Tổng phải nộp (bao gồm cọc hoàn lại): <b th:text="${quote.total}"></b>đ</div><div class="text-[#821f1c]">Thanh toán trước để giữ lịch: <b th:text="${quote.booking}"></b>đ</div></dl><form th:action="@{/checkout}" method="post" class="mt-6"><input th:each="id:${productIds}" type="hidden" name="productIds" th:value="${id}"><input type="hidden" name="start" th:value="${start}"><input type="hidden" name="end" th:value="${end}"><input type="hidden" name="fulfilment" th:value="${fulfilment}"><input type="hidden" name="payment" th:value="${payment}"><input type="hidden" name="address" th:value="${address}"><input type="hidden" name="code" th:value="${code}"><input type="hidden" name="full" th:value="${full}"><button class="btn">Tạo đơn chờ thanh toán</button></form><p class="mt-3 text-sm">Giá và tình trạng còn trống được kiểm tra lại khi xác nhận.</p></section></main></body></html>
