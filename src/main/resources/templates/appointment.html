<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head}"></head><body class="bg-[#f6f1e8] text-stone-800"><header th:replace="~{fragments :: header}"></header><main class="mx-auto max-w-7xl p-5 md:p-10"><form th:action="@{/appointments}" method="post" class="panel max-w-xl mx-auto"><h1>Đặt lịch thử đồ</h1><p>Khung 30 phút, từ 08:00 đến 17:30. Hệ thống kiểm tra chỗ trống khi đặt.</p><label>Họ tên<input name="customerName" required></label><label>Điện thoại<input name="phone" required></label><label>Khung giờ<input type="datetime-local" name="appointmentAt" step="1800" required></label><label>Ghi chú<textarea name="note"></textarea></label><button class="btn">Đặt lịch</button></form></main></body></html>
