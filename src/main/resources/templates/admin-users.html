<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head}"></head>
<body class="bg-[#f6f1e8] text-stone-800"><header th:replace="~{fragments :: header}"></header><main class="mx-auto max-w-6xl p-5 md:p-10">
  <div id="user-flash" th:if="${param.customerUpdated != null or param.customerDeleted != null or param.staffUpdated != null}" role="status" aria-live="polite" class="fixed right-5 top-5 z-50 rounded bg-green-700 px-4 py-3 text-white shadow-lg" th:text="${param.customerUpdated != null ? 'Đã cập nhật thông tin khách hàng.' : (param.customerDeleted != null ? 'Đã xóa khách hàng.' : 'Đã cập nhật thông tin nhân viên / quản trị viên.')}"></div>
  <script th:if="${param.customerUpdated != null or param.customerDeleted != null or param.staffUpdated != null}">window.setTimeout(() => document.getElementById('user-flash')?.remove(), 2000);</script>
  <h1>Quản lý người dùng</h1><a href="/admin" class="secondary">← Quản trị</a>
  <section class="panel overflow-auto"><h2>Khách hàng</h2><table class="w-full"><tr><th>Email</th><th>Họ tên</th><th>Điện thoại</th><th>Mật khẩu mới</th><th>Thao tác</th></tr>
    <tr th:each="c : ${customers}"><td><input th:attr="form=${'customer-'+c.id}" type="email" name="email" th:value="${c.email}" required maxlength="254" autocomplete="email"></td><td><input th:attr="form=${'customer-'+c.id}" name="fullName" th:value="${c.fullName}" required maxlength="150"></td><td><input th:attr="form=${'customer-'+c.id}" type="tel" name="phone" th:value="${c.phone}" maxlength="25" autocomplete="tel"></td><td><input th:attr="form=${'customer-'+c.id}" type="password" name="password" minlength="8" autocomplete="new-password" placeholder="Để trống nếu không đổi"></td><td class="whitespace-nowrap"><form th:id="${'customer-'+c.id}" th:action="@{/admin/customers/{id}(id=${c.id})}" method="post" class="inline"><button class="secondary">Lưu thay đổi</button></form><form th:action="@{/admin/customers/{id}/delete(id=${c.id})}" method="post" class="ml-2 inline"><button class="secondary" onclick="return confirm('Xóa khách hàng này?')">Xóa</button></form></td></tr>
  </table></section>
  <section class="panel overflow-auto"><h2>Nhân viên &amp; quản trị viên</h2><table class="w-full"><tr><th>Email</th><th>Họ tên</th><th>Vai trò</th><th>Hoạt động</th><th></th></tr>
    <tr th:each="s : ${staffAccounts}"><td th:text="${s.email}"></td><td><input th:attr="form=${'staff-'+s.id}" name="fullName" th:value="${s.fullName}" required></td><td><select th:attr="form=${'staff-'+s.id}" name="role"><option value="STAFF" th:selected="${s.role=='STAFF'}">Nhân viên</option><option value="ADMIN" th:selected="${s.role=='ADMIN'}">Admin</option></select></td><td><input th:attr="form=${'staff-'+s.id}" type="checkbox" name="enabled" value="true" th:checked="${s.enabled}"></td><td><form th:id="${'staff-'+s.id}" th:action="@{/admin/staff/{id}/update(id=${s.id})}" method="post"><button class="secondary">Cập nhật</button></form></td></tr>
  </table></section>
</main></body></html>
