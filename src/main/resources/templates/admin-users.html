<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head}"></head><body class="bg-[#f6f1e8] text-stone-800"><header th:replace="~{fragments :: header}"></header><main class="mx-auto max-w-6xl p-5 md:p-10"><h1>Quản lý người dùng</h1><a href="/admin" class="secondary">← Quản trị</a><section class="panel overflow-auto"><h2>Khách hàng</h2><table class="w-full"><tr><th>Email</th><th>Họ tên</th><th>Điện thoại</th><th>Thao tác</th></tr><tr th:each="c:${customers}"><form th:action="@{/admin/customers/{id}(id=${c.id})}" method="post"><td th:text="${c.email}"></td><td><input name="fullName" th:value="${c.fullName}" required></td><td><input name="phone" th:value="${c.phone}"></td><td><button class="secondary">Lưu</button></td></form></tr></table></section><section class="panel overflow-auto"><h2>Nhân viên &amp; quản trị viên</h2><table class="w-full"><tr><th>Email</th><th>Họ tên</th><th>Vai trò</th><th>Hoạt động</th><th></th></tr><tr th:each="s:${staffAccounts}"><form th:action="@{/admin/staff/{id}/update(id=${s.id})}" method="post"><td th:text="${s.email}"></td><td><input name="fullName" th:value="${s.fullName}" required></td><td><select name="role"><option value="STAFF" th:selected="${s.role=='STAFF'}">Nhân viên</option><option value="ADMIN" th:selected="${s.role=='ADMIN'}">Admin</option></select></td><td><input type="checkbox" name="enabled" value="true" th:checked="${s.enabled}"></td><td><button class="secondary">Cập nhật</button></td></form></tr></table></section></main></body></html>
