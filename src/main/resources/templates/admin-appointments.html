<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head}"></head>
<body class="bg-[#f6f1e8] text-stone-800"><header th:replace="~{fragments :: header}"></header><main class="mx-auto max-w-6xl p-5 md:p-10">
  <h1>Quản lý lịch thử đồ</h1><a href="/admin" class="secondary">← Quản trị</a>
  <section class="panel overflow-auto"><table class="w-full"><tr><th>Khách / Email</th><th>Liên hệ</th><th>Thời gian</th><th>Ghi chú</th><th>Trạng thái</th><th>Thao tác</th></tr>
    <tr th:each="a : ${appointments}"><td><input th:attr="form=${'appointment-'+a.id}" name="customerName" th:value="${a.customerName}" required><small th:text="${a.customerEmail}"></small></td><td><input th:attr="form=${'appointment-'+a.id}" name="phone" th:value="${a.phone}"></td><td><input th:attr="form=${'appointment-'+a.id}" name="appointmentAt" type="datetime-local" th:value="${#temporals.format(a.appointmentAt, 'yyyy-MM-dd''T''HH:mm')}" required></td><td><input th:attr="form=${'appointment-'+a.id}" name="note" th:value="${a.note}"></td><td><select th:attr="form=${'appointment-'+a.id}" name="status"><option th:each="s : ${ {'Đã đặt lịch','Đã hủy','Đã hoàn thành'} }" th:value="${s}" th:text="${s}" th:selected="${s==a.status}"></option></select></td><td class="whitespace-nowrap"><form th:id="${'appointment-'+a.id}" th:action="@{/admin/appointments/{id}(id=${a.id})}" method="post" class="inline"><button class="secondary">Lưu</button></form><form th:action="@{/admin/appointments/{id}/delete(id=${a.id})}" method="post" class="ml-2 inline"><button class="secondary" onclick="return confirm('Xóa lịch đặt này?')">Xóa</button></form></td></tr>
  </table></section>
</main></body></html>
