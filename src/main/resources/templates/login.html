<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head}"></head><body class="bg-[#f6f1e8] text-stone-800"><header th:replace="~{fragments :: header}"></header><main class="mx-auto max-w-7xl p-5 md:p-10"><section class="panel max-w-md mx-auto"><h1>Đăng nhập</h1><p th:if="${param.error}" role="alert" class="text-red-700">Email/mật khẩu chưa đúng hoặc tài khoản nhân viên đang chờ duyệt.</p><p th:if="${param.registered}" class="text-green-700">Đã đăng ký. Tài khoản nhân viên cần quản lý phê duyệt trước khi đăng nhập.</p><form th:action="@{/login}" method="post"><label>Email<input name="email" type="email" required autocomplete="username"></label><label>Mật khẩu<input id="password" name="password" type="password" required autocomplete="current-password"></label><button type="button" class="secondary mb-4" data-toggle-password="password" aria-label="Hiện hoặc ẩn mật khẩu">◉ Hiện/ẩn mật khẩu</button><button class="btn w-full">Đăng nhập</button></form><div class="mt-4 flex gap-4"><a href="/register">Đăng ký khách hàng</a><a href="/staff/register">Đăng ký nhân viên</a></div></section></main></body></html>
