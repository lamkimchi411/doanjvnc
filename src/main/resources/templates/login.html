<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head}"></head><body class="bg-[#f6f1e8] text-stone-800"><header th:replace="~{fragments :: header}"></header><main class="mx-auto max-w-7xl p-5 md:p-10"><section class="panel max-w-md mx-auto"><h1>Đăng nhập</h1><p th:if="${param.error}" role="alert" class="text-red-700">Email hoặc mật khẩu chưa đúng.</p><p th:if="${param.registered != null and param.registered[0] == 'customer'}" class="text-green-700">Đăng ký khách hàng thành công. Bạn có thể đăng nhập ngay, không cần quản trị viên duyệt.</p><p th:if="${param.registered != null and param.registered[0] == 'staff'}" class="text-green-700">Đã gửi đăng ký nhân viên. Tài khoản sẽ đăng nhập được sau khi quản trị viên phê duyệt.</p><form th:action="@{/login}" method="post"><label>Email<input name="email" type="email" required autocomplete="username"></label><label>Mật khẩu<div class="relative"><input id="password" name="password" type="password" required autocomplete="current-password" class="pr-12"><button type="button" class="absolute right-2 top-1/2 -translate-y-1/2 rounded p-2 text-lg leading-none text-stone-600 hover:text-[#821f1c]" data-toggle-password="password" aria-label="Hiện mật khẩu" title="Hiện mật khẩu"><span class="eye-hidden" aria-hidden="true">◉</span><span class="eye-visible hidden" aria-hidden="true">⊘</span></button></div></label><button class="btn w-full">Đăng nhập</button></form><div class="mt-4 flex gap-4"><a href="/register">Đăng ký khách hàng</a><a href="/staff/register">Đăng ký nhân viên</a></div></section></main></body></html>
