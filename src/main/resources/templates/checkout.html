<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head}"></head><body class="bg-[#f6f1e8] text-stone-800"><header th:replace="~{fragments :: header}"></header><main class="mx-auto max-w-7xl p-5 md:p-10"><section class="panel max-w-2xl mx-auto"><p class="text-xs tracking-widest text-[#80684d] mb-2">BOOKING DEPOSIT</p><h1>GIỮ LỊCH VIỆT PHỤC</h1><p class="text-red-700 bg-red-50 p-3 rounded" th:if="${error}" th:text="${error}"></p><form class="mt-5 space-y-4" method="post"><label>Chọn Việt phục<select name="productId" required><option th:each="p:${items}" th:value="${p.id}" th:text="${p.name}"></option></select></label><div class="grid grid-cols-2 gap-4"><label>Ngày nhận đồ<input type="date" name="start" required></label><label>Ngày trả đồ<input type="date" name="end" required></label></div><fieldset class="border-0 p-0"><legend class="font-semibold text-sm mb-2">Hình thức nhận đồ</legend><label class="block text-sm mb-1"><input type="radio" name="fulfilment" value="PICKUP" checked> Nhận tại cửa hàng</label><label class="block text-sm"><input type="radio" name="fulfilment" value="DELIVERY"> Giao tận nơi (phí ship 2 chiều)</label></fieldset><fieldset class="border-0 p-0"><legend class="font-semibold text-sm mb-2">Thanh toán cọc</legend><label class="block text-sm mb-1"><input type="radio" name="payment" value="BANK" checked> Chuyển khoản / QR Bank</label><label class="block text-sm"><input type="radio" name="payment" value="CASH"> Tiền mặt tại cửa hàng</label></fieldset><p class="text-sm text-stone-500 border-l-3 border-[#b8955e] pl-3">Cọc giữ lịch = 30% tiền thuê. Tiền cọc bảo đảm trang phục được theo dõi và hoàn lại sau khi trả đồ thành công.</p><button class="btn w-full">XÁC NHẬN ĐẶT CỌC</button></form></section></main></body></html>
