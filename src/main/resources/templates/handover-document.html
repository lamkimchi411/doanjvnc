<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><script src="https://cdn.tailwindcss.com"></script><title>Biên bản bàn giao</title></head><body class="bg-stone-100 p-8"><main class="mx-auto max-w-2xl bg-white p-10 shadow"><div class="flex justify-between border-b-2 border-[#821f1c] pb-5"><div><p class="text-xs">CỔ VIỆT LÂU</p><h1 class="font-serif text-3xl text-[#821f1c]">BIÊN BẢN BÀN GIAO</h1></div><b th:text="${'#CVL-'+order.id}"></b></div><section class="mt-7 space-y-3 text-sm"><p>Khách hàng: <b th:text="${order.customerName?:order.customerEmail}"></b></p><p>Trang phục: <b th:text="${order.product.name}"></b> · Mã tem: <b th:text="${order.product.barcode}"></b></p><p>Thời gian thuê: <span th:text="${order.pickupDate+' đến '+order.returnDate}"></span></p><p>Tình trạng giao: <span th:text="${order.conditionOut?:'Chưa bàn giao'}"></span></p><p>Tình trạng trả: <span th:text="${order.conditionReturn?:'Chưa nhận trả'}"></span></p><p>Tài sản đảm bảo: <span th:text="${order.collateralType?:'-'}"></span> <span th:text="${order.collateralReference}"></span></p><hr><p>Tiền phạt: <b th:text="${#numbers.formatInteger(order.penaltyTotal,3,'POINT')+'đ'}"></b></p><p>Hoàn cọc: <b th:text="${#numbers.formatInteger(order.refundedDeposit,3,'POINT')+'đ'}"></b></p></section><button onclick="window.print()" class="mt-8 bg-[#821f1c] px-5 py-3 text-xs text-white">IN BIÊN BẢN</button><a href="/staff" class="ml-3 text-xs underline">Quay lại POS</a></main></body></html>
