<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head}"></head><body class="bg-[#f6f1e8] text-stone-800"><header th:replace="~{fragments :: header}"></header><main class="mx-auto max-w-7xl p-5 md:p-10"><section class="panel grid md:grid-cols-2 gap-8"><img th:src="${productImages[product.id]}" th:alt="${product.name}" class="w-full max-h-[550px] object-cover"><div><h1 th:text="${product.name}"></h1><p th:text="${product.description}"></p><p class="my-4" th:text="${product.size+' · '+product.color+' · '+product.style}"></p><p th:text="${'Mã bộ đồ: '+product.barcode}"></p><p th:text="${'Giá ngày thường: '+#numbers.formatInteger(product.dailyPrice,1,'POINT')+'đ'}"></p><p th:text="${'Cọc bảo đảm: '+#numbers.formatInteger(product.depositAmount,1,'POINT')+'đ'}"></p><p th:text="${'Chi tiết đi kèm: '+(product.components?:'Áo chính')}"></p><div class="mt-5 flex flex-wrap gap-3"><form th:action="@{/cart/add/{id}(id=${product.id})}" method="post"><button class="btn">Thêm vào giỏ</button></form><a th:if="${product.salePrice != null and product.salePrice gt 0 and product.stockStatus == 'AVAILABLE'}" class="secondary" th:href="@{/purchase/{id}(id=${product.id})}">Mua ngay</a></div><p th:if="${product.salePrice == null or product.salePrice le 0}" class="mt-3 text-sm text-stone-500">Sản phẩm này hiện chưa mở bán.</p><a class="secondary mt-3" th:href="@{/collection}">Xem các sản phẩm khác</a></div></section><h2>Phụ kiện phối cùng</h2><div class="grid md:grid-cols-4 gap-4"><form th:each="p:${suggestions}" class="panel" th:action="@{/cart/add/{id}(id=${p.id})}" method="post"><img th:src="${productImages[p.id]}" class="h-36 w-full object-cover" alt="Phụ kiện"><h2 th:text="${p.name}"></h2><p th:text="${#numbers.formatInteger(p.dailyPrice,1,'POINT')+'đ/ngày'}"></p><button class="secondary">Thêm phụ kiện</button></form></div></main></body></html>
