<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head}"></head><body class="bg-[#f6f1e8] text-stone-800"><header th:replace="~{fragments :: header}"></header><main class="mx-auto max-w-7xl p-5 md:p-10"><section class="panel max-w-xl mx-auto text-center"><p class="text-xs tracking-widest text-[#80684d] mb-2">ĐẶT LỊCH THÀNH CÔNG</p><h1>ĐÃ GIỮ LỊCH CHO BẠN</h1><p>Mã đơn <b th:text="${'#CVL-'+order.id}"></b> · Trạng thái: <b th:text="${order.status}"></b></p><div class="panel bg-amber-50 border-amber-200 mt-5"><p>Tiền thuê: <b th:text="${#numbers.formatInteger(order.rentalTotal,1,'POINT')+'đ'}"></b></p><p>Tiền cọc bảo đảm: <b th:text="${#numbers.formatInteger(order.depositTotal,1,'POINT')+'đ'}"></b></p><p class="text-[#821f1c] font-bold mt-2">Số tiền cần thanh toán để giữ lịch: <strong th:text="${#numbers.formatInteger(order.bookingDeposit,1,'POINT')+'đ'}"></strong></p></div><a class="btn mt-5" th:href="@{/account}">XEM ĐƠN THUÊ</a></section></main></body></html>
