<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head}"></head><body class="bg-[#f6f1e8] text-stone-800"><header th:replace="~{fragments :: header}"></header><main class="mx-auto max-w-7xl p-5 md:p-10"><h1>Quản trị ảnh trang chủ</h1><a href="/admin">← Quản trị</a><p>Ảnh JPEG/PNG tối đa 10 MB.</p><div class="grid md:grid-cols-2 gap-5"><form th:each="i:${images}" th:action="@{/admin/media}" method="post" enctype="multipart/form-data" class="panel"><h2 th:text="${i.title}"></h2><input name="slot" type="hidden" th:value="${i.slot}"><img th:src="${i.imageUrl}" class="h-48 w-full object-cover" alt="Ảnh hiện tại"><label>Tiêu đề<input name="title" th:value="${i.title}" required></label><label>Ảnh mới<input type="file" name="image" accept="image/jpeg,image/png" required></label><button class="btn">Lưu ảnh</button></form></div></main></body></html>
