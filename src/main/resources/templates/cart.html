<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head}"></head>
<body class="bg-[#f6f1e8] text-stone-800">
<header th:replace="~{fragments :: header}"></header>
<main class="mx-auto max-w-7xl p-5 md:p-10">
<style>
.cart-row{display:flex;align-items:center;gap:18px}.cart-info{flex:1;min-width:140px}
.cart-controls{display:flex;align-items:end;gap:8px;flex-wrap:nowrap}
.cart-variant{width:390px;min-width:180px;display:flex;align-items:end;gap:6px}
.cart-variant label{min-width:0;flex:1}.cart-controls form{margin:0}.cart-controls button{white-space:nowrap}
.cart-controls select{width:100%;min-width:0;margin-bottom:0}.cart-controls>form{flex-shrink:0}.cart-controls button:disabled{opacity:.5;cursor:not-allowed}
@media(max-width:1000px){.cart-row{flex-wrap:wrap}.cart-controls{width:100%;overflow-x:auto;padding-bottom:6px}.cart-variant{flex:1}}
</style>
<h1>Giỏ đồ</h1>
<p>Mỗi mã tem tương ứng một bộ đồ thực tế. Chọn Thuê hoặc Mua cho từng sản phẩm.</p>
<p th:if="${#lists.isEmpty(items)}" class="panel">Giỏ hàng trống. <a href="/collection">Chọn Việt phục</a></p>
<section th:each="p,stat:${items}" class="panel cart-row">
 <img th:src="${productImages[p.id]}" class="h-24 w-20 object-cover" th:alt="${p.name}">
 <div class="cart-info"><small th:text="${'Sản phẩm '+stat.count}"></small><h2 th:text="${p.name}"></h2><small th:text="${p.barcode+' / '+p.size}"></small></div>
 <div class="cart-controls">
  <form th:action="@{/cart/replace/{id}(id=${p.id})}" method="post" class="cart-variant">
   <label>Đổi bộ/biến thể<select name="replacement"><option th:each="v:${products}" th:value="${v.id}" th:text="${v.name+' / '+v.size+' / '+v.barcode}" th:selected="${v.id==p.id}"></option></select></label>
   <button class="secondary">Cập nhật</button>
  </form>
  <form th:action="@{/cart/rent}" method="get"><input type="hidden" name="productIds" th:value="${p.id}"><button class="btn">Thuê</button></form>
  <form th:action="@{/cart/purchase}" method="get"><input type="hidden" name="productIds" th:value="${p.id}"><button class="secondary" th:disabled="${p.salePrice == null or p.salePrice le 0 or p.stockStatus != 'AVAILABLE'}" title="Chỉ mua được sản phẩm đang sẵn sàng và có giá bán">Mua</button></form>
  <form th:action="@{/cart/remove/{id}(id=${p.id})}" method="post"><button class="secondary">Xóa</button></form>
 </div>
</section>
</main></body></html>
