<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head}"></head><body class="bg-[#f6f1e8] text-stone-800"><header th:replace="~{fragments :: header}"></header><main class="mx-auto max-w-7xl p-5 md:p-10"><h1>Giỏ thuê</h1><p>Mỗi mã tem tương ứng một bộ đồ thực tế. Muốn thuê thêm cùng mẫu, chọn một mã khác.</p><p th:if="${#lists.isEmpty(items)}" class="panel">Giỏ hàng trống. <a href="/collection">Chọn Việt phục</a></p><section th:each="p:${items}" class="panel flex flex-wrap gap-5 items-center"><img th:src="${p.imageUrl}" class="h-24 w-20 object-cover" alt="Sản phẩm"><div><h2 th:text="${p.name}"></h2><small th:text="${p.barcode+' / '+p.size}"></small></div><form th:action="@{/cart/replace/{id}(id=${p.id})}" method="post" class="flex-1"><label>Đổi bộ/biến thể<select name="replacement"><option th:each="v:${products}" th:value="${v.id}" th:text="${v.name+' / '+v.size+' / '+v.barcode}" th:selected="${v.id==p.id}"></option></select></label><button class="secondary">Cập nhật</button></form><form th:action="@{/cart/remove/{id}(id=${p.id})}" method="post"><button class="secondary">Xóa</button></form></section><form th:if="${!#lists.isEmpty(items)}" th:action="@{/checkout/preview}" method="post" class="panel grid md:grid-cols-2 gap-4"><h2 class="md:col-span-2">Lịch thuê & dự toán</h2><label>Ngày nhận<input type="date" name="start" required></label><label>Ngày trả<input type="date" name="end" required></label><label>Nhận đồ<select name="fulfilment"><option value="PICKUP">Tại cửa hàng</option><option value="DELIVERY">Giao tận nơi — tính ship 2 chiều</option></select></label><label>Thanh toán<select name="payment"><option value="BANK">Chuyển khoản</option><option value="CASH">Tiền mặt</option></select></label><label>Địa chỉ giao<input name="address" maxlength="250"></label><label>Voucher / mã combo<input name="code"></label><label><input type="checkbox" name="full" value="true"> Nộp trước toàn bộ cọc bảo đảm thay cọc giữ lịch</label><button class="btn">Xem chi phí trước khi đặt</button></form></main></body></html>
