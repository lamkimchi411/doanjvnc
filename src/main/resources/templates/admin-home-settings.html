<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head}"></head>
<body class="bg-[#f6f1e8] text-stone-800">
<header th:replace="~{fragments :: header}"></header>
<main class="mx-auto max-w-7xl p-5 md:p-10">
  <div class="mb-5 flex flex-wrap items-center justify-between gap-3">
    <div><h1 class="mb-1">Cài đặt trang chủ</h1><p class="text-sm text-stone-500">Ảnh, nội dung, bản đồ và các kênh liên hệ được lưu cùng lúc.</p></div>
    <a href="/admin" class="secondary">← Quản trị</a>
  </div>
  <p th:if="${param.success}" role="status" class="mb-5 rounded bg-green-50 p-3 text-green-800">Đã lưu cài đặt trang chủ thành công.</p>
  <form th:action="@{/admin/home-settings}" method="post" enctype="multipart/form-data" class="space-y-5">
    <section class="panel">
      <h2>Thông tin và liên hệ</h2>
      <div class="grid gap-4 md:grid-cols-2">
        <label class="md:col-span-2">Tiêu đề trang chủ<input name="homeTitle" th:value="${policy.homeTitle}" required></label>
        <label class="md:col-span-2">Mô tả trang chủ<textarea name="homeSubtitle" rows="3" th:text="${policy.homeSubtitle}"></textarea></label>
        <label>Địa chỉ cửa hàng<input name="storeAddress" th:value="${policy.storeAddress}" required></label>
        <label>Số điện thoại / liên hệ<input name="storePhone" th:value="${policy.storePhone}" required></label>
        <label>Liên kết Google Maps<input type="url" name="storeMapUrl" th:value="${policy.storeMapUrl}" required></label>
        <label>Liên kết Facebook / mạng xã hội<input type="url" name="storeSocialUrl" th:value="${policy.storeSocialUrl}" required></label>
      </div>
    </section>
    <section class="panel">
      <div class="mb-4"><h2>Hình ảnh trang chủ</h2><p class="text-sm text-stone-500">Chỉ chọn ảnh mới tại vị trí cần thay đổi. Ảnh JPEG/PNG, tối đa 10 MB.</p></div>
      <div class="grid gap-5 md:grid-cols-2 lg:grid-cols-3">
        <article th:each="i : ${images}" class="overflow-hidden rounded-lg border border-[#b8955e]/30 bg-white">
          <img th:src="${i.imageUrl}" class="h-44 w-full object-cover" th:alt="${i.title}">
          <div class="p-4">
            <input type="hidden" name="slots" th:value="${i.slot}">
            <label>Tiêu đề ảnh<input name="imageTitles" th:value="${i.title}" required></label>
            <label>Thay ảnh <small>(không bắt buộc)</small><input type="file" name="imageFiles" accept="image/jpeg,image/png"></label>
          </div>
        </article>
      </div>
    </section>
    <div class="flex justify-end"><button class="btn px-6 py-3 text-base">Lưu toàn bộ cài đặt trang chủ</button></div>
  </form>
</main>
</body>
</html>
