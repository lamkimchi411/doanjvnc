<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head}"></head><body class="bg-[#f6f1e8] text-stone-800"><header th:replace="~{fragments :: header}"></header><main class="mx-auto max-w-5xl p-5 md:p-10"><h1>Quản lý danh mục</h1><a href="/admin" class="secondary">← Quản trị</a><form th:action="@{/admin/categories}" method="post" class="panel grid md:grid-cols-3 gap-4"><label>Tên danh mục<input name="name" required placeholder="Ví dụ: Nhật Bình"></label><label class="md:col-span-2">Mô tả<textarea name="description" rows="2"></textarea></label><button class="btn w-fit">Thêm danh mục</button></form><section class="panel overflow-auto"><table class="w-full"><tr><th>Danh mục</th><th>Mô tả</th><th>Thao tác</th></tr><tr th:each="c:${categories}"><form th:action="@{/admin/categories}" method="post"><input type="hidden" name="id" th:value="${c.id}"><td><input name="name" th:value="${c.name}" required></td><td><input name="description" th:value="${c.description}"></td><td><button class="secondary">Lưu</button></td></form></tr></table></section></main></body></html>
