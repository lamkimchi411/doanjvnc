<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head}"></head><body class="bg-[#f6f1e8] text-stone-800"><header th:replace="~{fragments :: header}"></header><main class="mx-auto max-w-3xl p-5 md:p-10"><h1>Thông tin trang chủ</h1><p th:if="${param.success}" role="status" class="mb-4 rounded bg-green-50 p-3 text-green-800">Đã lưu thông tin trang chủ thành công.</p><a href="/admin" class="secondary">← Quản trị</a><form th:action="@{/admin/home-content}" method="post" class="panel"><p class="mb-4 text-sm text-stone-500">Nội dung này hiển thị ở khu vực dưới cùng của nền phải trên trang chủ.</p><label>Tiêu đề trang chủ<input name="homeTitle" th:value="${policy.homeTitle}" required></label><label>Mô tả trang chủ<textarea name="homeSubtitle" rows="2" th:text="${policy.homeSubtitle}"></textarea></label><label>Địa chỉ cửa hàng<input name="storeAddress" th:value="${policy.storeAddress}" required></label><label>Số điện thoại / liên hệ<input name="storePhone" th:value="${policy.storePhone}" required></label><label>Liên kết Google Maps<input type="url" name="storeMapUrl" th:value="${policy.storeMapUrl}" required></label><label>Liên kết Facebook / mạng xã hội<input type="url" name="storeSocialUrl" th:value="${policy.storeSocialUrl}" required></label><button class="btn">Lưu thông tin trang chủ</button></form></main></body></html>
