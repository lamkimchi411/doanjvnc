<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head}"></head><body class="bg-[#f6f1e8] text-stone-800"><header th:replace="~{fragments :: header}"></header><main class="mx-auto max-w-4xl p-5"><a href="/cart">← Về giỏ đồ</a><h1>Thuê sản phẩm</h1><p th:each="p:${items}" th:text="${p.name+' · '+p.barcode}"></p><form  th:action="@{/checkout/preview}" method="post" class="panel grid md:grid-cols-2 gap-4"><input th:each="p:${items}" type="hidden" name="productIds" th:value="${p.id}"><h2 class="md:col-span-2">Lịch thuê & dự toán</h2><label>Ngày nhận<input type="datetime-local" name="start" required></label><label>Ngày trả<input type="datetime-local" name="end" required></label><label>Nhận đồ<select name="fulfilment"><option value="PICKUP">Tại cửa hàng</option><option value="DELIVERY">Giao tận nơi — tính ship 2 chiều</option></select></label><label>Thanh toán<select name="payment"><option value="BANK">Chuyển khoản</option><option value="CASH">Tiền mặt</option></select></label><label>Địa chỉ giao<input name="address" maxlength="250"></label><label>Voucher / mã combo<input name="code"></label><label><input type="checkbox" name="full" value="true"> Nộp trước toàn bộ cọc bảo đảm thay cọc giữ lịch</label><button class="btn">Xem chi phí trước khi đặt</button></form></main></body></html>
