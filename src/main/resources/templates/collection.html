<!doctype html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments :: head}"></head>
<body class="bg-[#f6f1e8] text-stone-800">
<header th:replace="~{fragments :: header}"></header>
<main class="mx-auto max-w-7xl p-5 md:p-10">
 <h1>Bộ sưu tập Việt phục & phụ kiện</h1>
 <form th:action="@{/collection}" method="get" class="panel flex flex-col gap-3 sm:flex-row sm:items-end">
  <label class="w-full sm:max-w-xl">Tìm theo tên sản phẩm
   <input name="q" th:value="${q}" maxlength="120" placeholder="Ví dụ: Nhật Bình" autocomplete="off">
  </label>
  <button class="btn whitespace-nowrap">Tìm sản phẩm</button>
 </form>
 <p th:if="${#lists.isEmpty(products)}">Không tìm thấy sản phẩm có tên phù hợp.</p>
 <div class="grid grid-cols-2 md:grid-cols-4 gap-5">
  <article class="panel !m-0" th:each="p:${products}">
   <img th:src="${productImages[p.id]}" th:alt="${p.name}" class="w-full h-60 object-cover rounded">
   <small th:text="${p.category+' · '+p.size+' · '+p.barcode}"></small>
   <h2 th:text="${p.name}"></h2>
   <p th:text="${#numbers.formatInteger(p.dailyPrice,1,'POINT')+'đ/ngày thường'}"></p>
   <a class="secondary mt-3" th:href="@{/product/{id}(id=${p.id})}">Xem chi tiết</a>
  </article>
 </div>
</main>
</body>
</html>
