<!doctype html><html lang="vi" xmlns:th="http://www.thymeleaf.org"><head th:replace="~{fragments :: head}"></head><body class="bg-[#f6f1e8] text-stone-800"><header th:replace="~{fragments :: header}"></header><main class="mx-auto max-w-7xl p-5 md:p-10"><h1>Bộ sưu tập Việt phục & phụ kiện</h1><form action="/collection" class="panel grid gap-3 md:grid-cols-4"><label>Tìm tên<input name="q" th:value="${param.q}"></label><label>Danh mục<select name="category"><option value="">Tất cả</option><option th:each="v:${categories}" th:value="${v}" th:text="${v}" th:selected="${param.category!=null and param.category[0]==v}"></option></select></label><label>Size<select name="size"><option value="">Tất cả</option><option th:each="v:${ {'S','M','L','XL','FreeSize'} }" th:text="${v}" th:selected="${param.size!=null and param.size[0]==v}"></option></select></label><label>Màu<select name="color"><option value="">Tất cả</option><option th:each="v:${colors}" th:text="${v}" th:selected="${param.color!=null and param.color[0]==v}"></option></select></label><label>Phong cách<select name="style"><option value="">Tất cả</option><option th:each="v:${styles}" th:text="${v}" th:selected="${param.style!=null and param.style[0]==v}"></option></select></label><label>Nhận đồ<input type="date" name="start" th:value="${param.start}"></label><label>Trả đồ<input type="date" name="end" th:value="${param.end}"></label><button class="btn self-center">Lọc & kiểm tra còn trống</button></form><p th:if="${#lists.isEmpty(products)}">Không có bộ đồ phù hợp trong khoảng ngày này.</p><div class="grid grid-cols-2 md:grid-cols-4 gap-5"><article class="panel !m-0" th:each="p:${products}"><img th:src="${p.imageUrl}" th:alt="${p.name}" class="w-full h-60 object-cover rounded"><small th:text="${p.category+' · '+p.size+' · '+p.barcode}"></small><h2 th:text="${p.name}"></h2><p th:text="${#numbers.formatInteger(p.dailyPrice,1,'POINT')+'đ/ngày thường'}"></p><a class="secondary mt-3" th:href="@{/product/{id}(id=${p.id})}">Xem chi tiết</a></article></div></main></body></html>
