services:
  - type: web
    name: co-viet-lau
    runtime: docker
    plan: free
    dockerCommand: java -Dserver.address=0.0.0.0 -Dserver.port=$PORT -jar app.jar
    healthCheckPath: /
    envVars:
      - key: DB_URL
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: PAYOS_CLIENT_ID
        sync: false
      - key: PAYOS_API_KEY
        sync: false
      - key: PAYOS_CHECKSUM_KEY
        sync: false
      - key: PAYOS_PUBLIC_URL
        sync: false
